---
# Pod Disruption Budget - ensure service availability during cluster maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: mystartup
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api

---
# Pod Disruption Budget for Worker
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: mystartup
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker

