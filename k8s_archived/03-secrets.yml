# Kubernetes Secret for sensitive data
# Create this with actual values using:
# kubectl create secret generic app-secrets \
#   --from-literal=database-connection-string='Server=...' \
#   --from-literal=azure-servicebus-connectionstring='Endpoint=...' \
#   -n mystartup

# Or use this template and fill in actual values
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mystartup
  labels:
    app: mystartup
    component: secrets
type: Opaque
stringData:
  # Database connection string for Azure SQL
  # Format: Server=tcp:servername.database.windows.net,1433;Initial Catalog=DatabaseName;User ID=username;Password=password;Encrypt=true;Connection Timeout=30;TrustServerCertificate=false;
  database-connection-string: "Server=tcp:mystartup-sql.database.windows.net,1433;Initial Catalog=MyStartUpCompanyDb;User ID=sqladmin;Password=YOUR_PASSWORD_HERE;Encrypt=true;Connection Timeout=30;TrustServerCertificate=false;"

  # Azure Service Bus connection string for Worker service
  # Format: Endpoint=sb://namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=key
  azure-servicebus-connectionstring: "Endpoint=sb://YOUR_NAMESPACE.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=YOUR_KEY;"

  # Application Insights instrumentation key (optional)
  applicationinsights-instrumentationkey: "00000000-0000-0000-0000-000000000000"
