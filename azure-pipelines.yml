trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/MyStartUpCompany.Api/**
      - src/MyStartUpCompany.Persistence/**
      - src/MyStartUpCompany.Domain/**

variables:
  # Azure Resource Configuration
  azureSubscription: 'YOUR_AZURE_SERVICE_CONNECTION_NAME' # Update this
  resourceGroup: 'rg-mystartupcompany-prod'
  location: 'eastus'
  
  # Container Registry
  containerRegistry: 'acrmystartupcompany.azurecr.io'
  containerRegistryServiceConnection: 'YOUR_ACR_SERVICE_CONNECTION_NAME' # Update this
  imageName: 'mystartupcompany-api'
  imageTag: '$(Build.BuildId)'
  
  # App Service Configuration
  webAppName: 'app-mystartupcompany-api-prod'
  
  # Database Configuration (stored in Azure DevOps Library as variable group)
  # Create a variable group named 'mystartupcompany-prod' with these variables:
  # - sqlServerName
  # - sqlDatabaseName
  # - sqlAdminUsername
  # - sqlAdminPassword (marked as secret)
  
  # Build Configuration
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'

stages:
  # ====================================
  # BUILD STAGE
  # ====================================
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildJob
        displayName: 'Build API and Run Tests'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          # Install .NET SDK
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)
              includePreviewVersions: false
          
          # Restore .NET tools (for EF migrations)
          - task: DotNetCoreCLI@2
            displayName: 'Restore .NET Tools'
            inputs:
              command: 'custom'
              custom: 'tool'
              arguments: 'restore'
          
          # Restore NuGet packages
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'
          
          # Build solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'
          
          # Run unit tests
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: '**/tests/**/*.Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
              publishTestResults: true
          
          # Build and push Docker image
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              containerRegistry: '$(containerRegistryServiceConnection)'
              repository: '$(imageName)'
              command: 'build'
              Dockerfile: 'src/MyStartUpCompany.Api/Dockerfile'
              tags: |
                $(imageTag)
                latest
          
          - task: Docker@2
            displayName: 'Push Docker Image to ACR'
            inputs:
              containerRegistry: '$(containerRegistryServiceConnection)'
              repository: '$(imageName)'
              command: 'push'
              tags: |
                $(imageTag)
                latest
          
          # Publish migration scripts (bundle)
          - task: DotNetCoreCLI@2
            displayName: 'Create EF Core Migration Bundle'
            inputs:
              command: 'custom'
              custom: 'ef'
              arguments: 'migrations bundle --project src/MyStartUpCompany.Persistence/MyStartUpCompany.Persistence.csproj --startup-project src/MyStartUpCompany.Api/MyStartUpCompany.Api.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/efbundle --self-contained --runtime linux-x64'
          
          # Publish ARM templates or Bicep files (if you have them)
          - task: CopyFiles@2
            displayName: 'Copy Infrastructure Files'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)/infrastructure'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/infrastructure'
            condition: and(succeeded(), exists('infrastructure'))
          
          # Publish pipeline artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Migration Bundle'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # ====================================
  # DEPLOY TO STAGING (Optional)
  # ====================================
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    variables:
      - group: 'mystartupcompany-staging' # Create this variable group in Azure DevOps
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy to Staging Environment'
        environment: 'staging'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: azure-deploy-template.yml
                  parameters:
                    azureSubscription: '$(azureSubscription)'
                    webAppName: 'app-mystartupcompany-api-staging'
                    containerRegistry: '$(containerRegistry)'
                    imageName: '$(imageName)'
                    imageTag: '$(imageTag)'
                    sqlConnectionString: 'Server=tcp:$(sqlServerName).database.windows.net,1433;Database=$(sqlDatabaseName);User ID=$(sqlAdminUsername);Password=$(sqlAdminPassword);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;'

  # ====================================
  # DEPLOY TO PRODUCTION
  # ====================================
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'mystartupcompany-prod' # Create this variable group in Azure DevOps
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Production Environment'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: azure-deploy-template.yml
                  parameters:
                    azureSubscription: '$(azureSubscription)'
                    webAppName: '$(webAppName)'
                    containerRegistry: '$(containerRegistry)'
                    imageName: '$(imageName)'
                    imageTag: '$(imageTag)'
                    sqlConnectionString: 'Server=tcp:$(sqlServerName).database.windows.net,1433;Database=$(sqlDatabaseName);User ID=$(sqlAdminUsername);Password=$(sqlAdminPassword);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;'