# OpenTelemetry Collector Configuration
# This configuration sets up the collector to receive traces, metrics, and logs
# from multiple sources and export them to Jaeger, Prometheus, and stdout
file_format: yaml

receivers:
  # OTLP receiver - receives data from OpenTelemetry SDKs
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus scraper - collects metrics from Prometheus endpoints
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

  # Jaeger receiver for compatibility
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_compact:
        endpoint: 0.0.0.0:6831

  # Zipkin receiver
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  # Batch processor - batches telemetry data before export
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter - prevents excessive memory usage
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource detection processor
  resourcedetection:
    detectors: [env, system, docker]
    timeout: 2s
    override: true

  # Attributes processor - adds/modifies attributes
  attributes:
    actions:
      - key: deployment.environment
        value: development
        action: insert

  # Span processor - processes trace data
  span:
    name:
      from_attributes: ["http.method", "http.url"]

exporters:
  # Jaeger exporter - exports traces to Jaeger
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Prometheus exporter - exports metrics to Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"

  # OTLP exporter - for metrics/logs to external systems
  otlp/prometheus:
    endpoint: prometheus:9009
    tls:
      insecure: true

  # Console exporter - useful for debugging
  logging:
    loglevel: info

  # Jaeger exporter for logs (via OTel)
  jaeger/logs:
    endpoint: jaeger:14250
    tls:
      insecure: true

extensions:
  # Health check extension
  health_check:
    endpoint: :13133

  # Performance profiler
  pprof:
    endpoint: :1777

  # Metrics endpoint for the collector itself
  zpages:
    endpoint: :55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [memory_limiter, resourcedetection, attributes, batch]
      exporters: [jaeger, logging]

    # Metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus, logging]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [logging]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888
